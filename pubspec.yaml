name: dijji
description: Dijji analytics, engagement, and in-app messaging SDK for Flutter. Two-line install, full parity with the iOS and Android SDKs.
version: 1.0.0-alpha
homepage: https://dijji.com
repository: https://github.com/urbaneyed/dijji-flutter
issue_tracker: https://github.com/urbaneyed/dijji-flutter/issues
documentation: https://dijji.com/install/flutter

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.0
  package_info_plus: ^8.0.0
  device_info_plus: ^11.0.0
  connectivity_plus: ^6.0.0
  battery_plus: ^6.0.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
